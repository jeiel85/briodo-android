# Play용 AAB를 CI에서 빌드해 Play 트랙에 올립니다(README "릴리스").
#
# - 태그 v<x.y.z>가 올라오면 그 버전을 내부 테스트(internal)와 비공개 테스트(alpha)에 올립니다.
# - Actions 화면에서 손으로 돌릴 수도 있습니다(version 입력).
#   - production을 켜면 같은 번들을 프로덕션에도 붙입니다(기본 꺼짐, 태그 실행에서는 항상 꺼짐).
#   - dry_run을 켜면 시험·빌드·서명 확인·트랙 조회까지만 하고 올리지 않습니다.
# - 버전·versionCode는 pubspec.yaml의 `version: x.y.z+N`에서 읽습니다. 태그·입력 버전과 다르면 멈춥니다.
# - 출시 노트: docs/release-notes/<x.y.z>/ko.txt(필수, 500자 이내)와 en.txt(선택). dry_run이면 없어도 됩니다.
# 비밀값은 GitHub 환경 'play'에만 있고, 그 환경은 jeiel85의 승인을 받아야 실행됩니다(main 브랜치·v* 태그만).
name: Play release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '버전 (x.y.z, pubspec.yaml의 version과 같아야 함)'
        required: true
      production:
        description: '프로덕션에도 올리기(전체 출시)'
        type: boolean
        default: false
      dry_run:
        description: '올리지 않고 시험·빌드·서명 확인·트랙 조회만'
        type: boolean
        default: false

concurrency:
  group: play-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  play:
    runs-on: ubuntu-latest
    environment: play
    timeout-minutes: 45
    env:
      PACKAGE: app.briodo
      # Play 업로드 키(.keystore/blenddo-release.jks) 인증서. 다른 키로 서명된 번들은 올리기 전에 멈춥니다.
      UPLOAD_CERT_SHA256: '7E:79:C6:3E:96:3B:EE:32:12:9F:E2:3F:36:91:34:67:C5:39:29:C6:72:12:20:C2:3A:C7:7D:8C:7E:3A:1C:A1'
    steps:
      - uses: actions/checkout@v4

      - name: 버전 정하기
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PRODUCTION: ${{ inputs.production }}
          INPUT_DRY: ${{ inputs.dry_run }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            VER="${GITHUB_REF_NAME#v}"; PROD=false; DRY=false
          else
            VER="$INPUT_VERSION"; PROD="${INPUT_PRODUCTION:-false}"; DRY="${INPUT_DRY:-false}"
          fi
          [[ "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::버전은 x.y.z여야 합니다: $VER"; exit 1; }
          LINE=$(grep -E '^version:' pubspec.yaml | head -n1 | tr -d '\r')
          [[ "$LINE" =~ ^version:\ *([0-9]+\.[0-9]+\.[0-9]+)\+([0-9]+)\ *$ ]] || { echo "::error::pubspec.yaml version 형식이 x.y.z+N이 아닙니다: $LINE"; exit 1; }
          PUB_VER="${BASH_REMATCH[1]}"; CODE="${BASH_REMATCH[2]}"
          [ "$PUB_VER" = "$VER" ] || { echo "::error::pubspec.yaml 버전($PUB_VER)과 요청 버전($VER)이 다릅니다"; exit 1; }
          NOTES_DIR="docs/release-notes/$VER"
          if [ ! -s "$NOTES_DIR/ko.txt" ]; then
            if [ "$DRY" = true ]; then echo "::warning::$NOTES_DIR/ko.txt가 없습니다(dry_run이라 계속)"; else echo "::error::$NOTES_DIR/ko.txt가 없습니다"; exit 1; fi
          fi
          {
            echo "version=$VER"; echo "code=$CODE"; echo "production=$PROD"; echo "dry=$DRY"; echo "notes_dir=$NOTES_DIR"
          } >> "$GITHUB_OUTPUT"
          echo "버전 $VER / versionCode $CODE / production=$PROD / dry_run=$DRY"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # v1.5.3(vc40)을 빌드한 버전(.metadata revision 00b0c91, Dart 3.11.5). 3.47.x에서는 home_widget 0.9.1
      # 컴파일이 jvm-target 문제로 깨지므로, Flutter를 올릴 때는 로컬 빌드와 함께 맞춥니다.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.9'
          cache: true

      - uses: gradle/actions/setup-gradle@v4

      - name: 의존성
        run: flutter pub get

      - name: 시험
        run: flutter test

      - name: 서명 키 놓기
        env:
          KEYSTORE_B64: ${{ secrets.BRIODO_UPLOAD_KEYSTORE_B64 }}
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/briodo-upload.jks"
          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$KEYSTORE_PATH"
          [ -s "$KEYSTORE_PATH" ] || { echo "::error::키스토어 비밀값이 비었습니다"; exit 1; }

      - name: AAB 빌드
        env:
          BRIODO_UPLOAD_STORE_PASSWORD: ${{ secrets.BRIODO_UPLOAD_STORE_PASSWORD }}
          BRIODO_UPLOAD_KEY_ALIAS: ${{ secrets.BRIODO_UPLOAD_KEY_ALIAS }}
          BRIODO_UPLOAD_KEY_PASSWORD: ${{ secrets.BRIODO_UPLOAD_KEY_PASSWORD }}
          VER: ${{ steps.ver.outputs.version }}
          CODE: ${{ steps.ver.outputs.code }}
        run: |
          export BRIODO_UPLOAD_STORE_FILE="$KEYSTORE_PATH"
          flutter build appbundle --release
          mkdir -p dist
          AAB="dist/BrioDo-v$VER-vc$CODE.aab"
          cp build/app/outputs/bundle/release/app-release.aab "$AAB"
          echo "AAB=$AAB" >> "$GITHUB_ENV"

      - name: 출시 노트 인자
        env:
          NOTES_DIR: ${{ steps.ver.outputs.notes_dir }}
        run: |
          ARGS=""
          [ -s "$NOTES_DIR/ko.txt" ] && ARGS="-NotesKoFile $NOTES_DIR/ko.txt"
          [ -s "$NOTES_DIR/en.txt" ] && ARGS="$ARGS -NotesEnFile $NOTES_DIR/en.txt"
          echo "NOTES_ARGS=$ARGS" >> "$GITHUB_ENV"
          for f in "$NOTES_DIR"/ko.txt "$NOTES_DIR"/en.txt; do [ -s "$f" ] && { echo "== $f"; cat "$f"; echo; }; done; true

      - uses: actions/upload-artifact@v4
        with:
          name: briodo-play-${{ steps.ver.outputs.version }}
          path: ${{ env.AAB }}
          retention-days: 30

      - name: Play 트랙 상태(올리기 전)
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: pwsh -NoProfile -File tools/play-publish.ps1 -PackageName "$PACKAGE" -ShowTracks

      - name: 내부 테스트·Alpha(·프로덕션)에 올리기
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          CODE: ${{ steps.ver.outputs.code }}
          DRY: ${{ steps.ver.outputs.dry }}
          PROD: ${{ steps.ver.outputs.production }}
        run: |
          DRYFLAG=(); [ "$DRY" = true ] && DRYFLAG=(-DryRun)
          read -r -a NOTES <<<"$NOTES_ARGS"
          pwsh -NoProfile -File tools/play-publish.ps1 -PackageName "$PACKAGE" -Track internal -AabPath "$AAB" \
            -ExpectedUploadCertSha256 "$UPLOAD_CERT_SHA256" "${NOTES[@]}" "${DRYFLAG[@]}"
          pwsh -NoProfile -File tools/play-publish.ps1 -PackageName "$PACKAGE" -Track alpha -ExpectedVersionCode "$CODE" \
            "${NOTES[@]}" "${DRYFLAG[@]}"
          if [ "$PROD" = true ]; then
            pwsh -NoProfile -File tools/play-publish.ps1 -PackageName "$PACKAGE" -Track production -ExpectedVersionCode "$CODE" \
              "${NOTES[@]}" "${DRYFLAG[@]}"
          fi

      - name: Play 트랙 상태(올린 뒤)
        if: steps.ver.outputs.dry != 'true'
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: pwsh -NoProfile -File tools/play-publish.ps1 -PackageName "$PACKAGE" -ShowTracks

      - name: 키 지우기
        if: always()
        run: rm -f "$RUNNER_TEMP/briodo-upload.jks"
